name: Build and release appliance
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'push' && github.ref_type == 'branch' && format('appliance-build-{0}', github.ref) || 'release-publication' }}
  cancel-in-progress: false
jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.detect.outputs.build }}
      publish: ${{ steps.detect.outputs.publish }}
      tag: ${{ steps.detect.outputs.tag }}
      selection: ${{ steps.detect.outputs.selection }}
      source: ${{ steps.detect.outputs.source }}
    steps:
      - name: Configure Git advice
        run: |
          git config --global advice.defaultBranchName false
          git config --global advice.detachedHead false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Detect new Fedora stable release
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          SOURCE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          printf 'build=false\npublish=false\n' >> "$GITHUB_OUTPUT"
          source="$SOURCE_COMMIT"
          if [[ "$EVENT_NAME" != push ]]; then
            project_tag="$(git for-each-ref --merged=refs/remotes/origin/main --sort=version:refname --format='%(refname:short)' 'refs/tags/v*' | tail -n 1)"
            if [[ -z "$project_tag" ]]; then
              echo "No project version tag on main exists yet; skipping Fedora publication."
              exit 0
            fi
            source="$(git rev-parse "$project_tag^{commit}")"
          fi
          printf 'source=%s\n' "$source" >> "$GITHUB_OUTPUT"
          python download-coreos.py prepare .ci
          python -c "import json, os; data=json.load(open('.ci/selection.json')); open(os.environ['GITHUB_OUTPUT'], 'a').write('selection='+json.dumps(data)+'\n')"
          if [[ "$EVENT_NAME" == push ]]; then
            if [[ "$REF_TYPE" != tag ]] || ! git merge-base --is-ancestor "$source" refs/remotes/origin/main; then
              printf 'build=true\n' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            tag="$REF_NAME"
          else
            tag="fcos-$(python -c "import json; print(json.load(open('.ci/selection.json'))['release'])")"
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --json isDraft,assets,targetCommitish > .ci/existing-release.json 2>/dev/null; then
            if python -c "import json,sys; r=json.load(open('.ci/existing-release.json')); sys.exit(0 if not r['isDraft'] else 1)"; then
              echo "Published release $tag is immutable; leaving it unchanged."
              exit 0
            fi
            python -c "import json,os; r=json.load(open('.ci/existing-release.json')); open(os.environ['GITHUB_OUTPUT'], 'a').write('source='+r['targetCommitish']+'\n')"
          fi
          printf 'build=true\npublish=true\n' >> "$GITHUB_OUTPUT"

  tests:
    needs: detect
    if: needs.detect.outputs.build == 'true'
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ needs.detect.outputs.source }}
  build:
    needs: [detect, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Configure Git advice
        run: |
          git config --global advice.defaultBranchName false
          git config --global advice.detachedHead false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.detect.outputs.source }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Package generic configuration and source
        env:
          FEDORA_SELECTION: ${{ needs.detect.outputs.selection }}
        shell: bash
        run: |
          python -c "import os; from pathlib import Path; Path('.ci').mkdir(exist_ok=True); Path('.ci/selection.json').write_text(os.environ['FEDORA_SELECTION'])"
          python build-release.py build/release --fedora-selection .ci/selection.json
      - name: Read pinned Fedora checksum and ISO filename
        id: fedora
        env:
          SOURCE_COMMIT: ${{ needs.detect.outputs.source }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          f = json.loads(Path('.ci/selection.json').read_text())
          prefix = 'esphome-appliance-fcos-' + f['release'] + '-' + os.environ['SOURCE_COMMIT'][:12]
          names = {
              'esphome-appliance-setup.zip': prefix + '-setup.zip',
              'fedora-base.json': prefix + '-fedora-base.json',
          }
          directory = Path('build/release')
          sums = ''.join(line + '\n' for line in (directory / 'SHA256SUMS').read_text().splitlines() if line.split('  ', 1)[1] != 'esphome-appliance.ign')
          (directory / 'esphome-appliance.ign').unlink()
          for old, new in names.items():
              (directory / old).rename(directory / new)
              sums = sums.replace('  ' + old + '\n', '  ' + new + '\n')
          (directory / (prefix + '-SHA256SUMS')).write_text(sums)
          (directory / 'SHA256SUMS').unlink()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fp:
              fp.write('sha256=' + f['sha256'] + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as fp:
              fp.write('ASSET_PREFIX=' + prefix + '\nISO_NAME=' + prefix + '.iso\n')
          PY
      - name: Cache unmodified Fedora ISO
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .ci/base.iso
          key: fedora-coreos-stable-x86_64-iso-${{ steps.fedora.outputs.sha256 }}
      - name: Download or verify pinned Fedora ISO
        run: |
          downloader=download-coreos.py
          if [[ ! -f "$downloader" ]]; then downloader=.download-coreos.py; fi
          python "$downloader" fetch .ci
      - name: Build and verify generic installer ISO
        run: python build-installer.py .ci/base.iso "build/release/$ISO_NAME"
      - name: Verify serial configuration against the original Fedora ISO
        run: |
          printf 'SERIAL_CONSOLE=true\n' > .ci/serial.env
          python build-installer.py .ci/base.iso .ci/serial.iso --env .ci/serial.env
          (cd .ci && sha256sum --check serial.iso.sha256)
          rm .ci/serial.iso .ci/serial.iso.sha256 .ci/serial.env
      - name: Include ISO checksums
        working-directory: build/release
        run: |
          cat "$ISO_NAME.sha256" >> "$ASSET_PREFIX-SHA256SUMS"
          sha256sum "$ISO_NAME.sha256" >> "$ASSET_PREFIX-SHA256SUMS"
      - name: Verify package checksums
        working-directory: build/release
        run: sha256sum --check "$ASSET_PREFIX-SHA256SUMS"
      - name: Upload build artifacts
        if: needs.detect.outputs.publish != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: esphome-appliance-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Publish GitHub Release assets
        if: needs.detect.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.detect.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.detect.outputs.source }}
          FEDORA_SELECTION: ${{ needs.detect.outputs.selection }}
        shell: bash
        run: |
          assets=("build/release/$ASSET_PREFIX-setup.zip" "build/release/$ASSET_PREFIX-SHA256SUMS" "build/release/$ISO_NAME" "build/release/$ISO_NAME.sha256")
          assets+=("build/release/$ASSET_PREFIX-fedora-base.json")
          python -c "import json,os; from pathlib import Path; f=json.loads(os.environ['FEDORA_SELECTION']); Path('build/release-notes.md').write_text('ESPHome appliance for Fedora CoreOS stable '+f['release']+'.\n\nOriginal Fedora ISO:\n'+f['location']+'\n\nFedora ISO SHA-256: '+f['sha256']+'\n\nSource commit: '+os.environ['RELEASE_COMMIT']+'\n\nIncludes a bootable generic installer ISO, its checksum, and a small setup package for local builds. Tests and ISO verification passed; publishing does not claim VM runtime validation of this new Fedora release.\n')"
          options=(--target "$RELEASE_COMMIT" --notes-file build/release-notes.md --title "ESPHome appliance ${RELEASE_TAG}")
          if [[ "$RELEASE_TAG" == v* ]]; then
            options+=(--verify-tag)
            if [[ "$RELEASE_TAG" == *-* ]]; then
              options+=(--prerelease)
            fi
          fi
          if gh release view "$RELEASE_TAG" --json isDraft,assets > build/release-state.json 2>/dev/null; then
            if python -c "import json,sys; r=json.load(open('build/release-state.json')); sys.exit(0 if not r['isDraft'] else 1)"; then
              echo "Release was already published; leaving it unchanged."
              exit 0
            fi
            python -c "import json; r=json.load(open('build/release-state.json')); legacy={'esphome-appliance-setup.zip','fedora-base.json','SHA256SUMS'}; print('\n'.join(a['name'] for a in r['assets'] if a['name'].endswith('.ign') or a['name'] in legacy))" > build/obsolete-assets.txt
            while IFS= read -r obsolete; do
              if [[ -n "$obsolete" ]]; then
                gh release delete-asset "$RELEASE_TAG" "$obsolete" --yes
              fi
            done < build/obsolete-assets.txt
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" --draft "${assets[@]}" "${options[@]}"
          fi
          gh release view "$RELEASE_TAG" --json isDraft,assets > build/release-state.json
          python -c "import json; from pathlib import Path; r=json.load(open('build/release-state.json')); expected={p.name:p.stat().st_size for p in Path('build/release').iterdir() if p.is_file()}; uploaded={a['name']:a['size'] for a in r['assets']}; missing=[name for name,size in expected.items() if uploaded.get(name)!=size]; missing and exit('Release upload verification failed: '+', '.join(missing))"
          gh release edit "$RELEASE_TAG" --draft=false
