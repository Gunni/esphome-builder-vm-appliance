name: Tests
on:
  workflow_call:
    inputs:
      ref:
        description: Source revision to validate for a release
        type: string
        required: false
        default: ''
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Configure Git advice
        run: |
          git config --global advice.defaultBranchName false
          git config --global advice.detachedHead false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Test with optimization
        run: python -O -m unittest discover -s tests -v
      - name: Check build and publication policy
        if: runner.os == 'Linux'
        run: |
          command -v bash jq git node
          test -f /usr/share/bash-completion/bash_completion
          test -f /usr/share/bash-completion/completions/journalctl
          test -f /usr/share/bash-completion/completions/systemctl
          python tests/check_workflow.py
      - name: Lint GitHub workflows
        if: runner.os == 'Linux'
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= -pyflakes= .github/workflows/*.yml
