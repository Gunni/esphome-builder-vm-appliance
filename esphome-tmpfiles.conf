# Type Path                         Mode User Group Age Argument
# Restore policy labels on provisioned symlinks themselves, not their targets.
z /etc/localtime                   -    -    -     -   -
d /var/lib/esphome                  0755 root root -   -
d /var/lib/esphome/config           0700 esphome esphome -   -
d /var/lib/esphome/cache            0700 esphome esphome -   -
d /var/lib/esphome/build            0700 esphome esphome -   -
d /var/lib/esphome/ccache           0700 esphome esphome -   -
# Disposable temporary build files; accessed/changed files are retained.
d /var/tmp/esphome                  0700 esphome esphome 7d  -
# Ignition may create configuration ancestors as root; correct them before sysinit.
d /var/home/esphome 0700 esphome esphome - -
d /var/home/esphome/.config 0755 esphome esphome - -
d /var/home/esphome/.config/systemd 0755 esphome esphome - -
d /var/home/esphome/.config/systemd/user 0755 esphome esphome - -
d /var/home/esphome/.config/systemd/user/timers.target.wants 0755 esphome esphome - -
d /var/home/esphome/.config/systemd/user/podman-auto-update.timer.d 0755 esphome esphome - -
f /var/lib/systemd/linger/esphome 0644 root root - -
d /var/home/esphome/.config/systemd/user/default.target.wants 0755 esphome esphome - -
